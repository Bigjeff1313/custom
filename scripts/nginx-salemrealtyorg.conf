server {
    listen 80;
    server_name salemrealtyorg.org www.salemrealtyorg.org;

    root /var/www/salemrealtyorg/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }
}
